services:
  postgres:
    image: postgres:14
    restart: always
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_DB=forgejo
      - POSTGRES_PASSWORD=CHANGE_ME # ⚠️ openssl rand -hex 32
    networks:
      - internal
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  forgejo:
    image: codeberg.org/forgejo/forgejo:12
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      
      # See https://forgejo.org/docs/latest/admin/config-cheat-sheet/ for more options
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgres:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=CHANGE_ME # ⚠️ change to POSTGRES_PASSWORD from above
      - FORGEJO__server__DOMAIN=git.$MY_DOMAIN
      - FORGEJO__server__ROOT_URL=https://git.$MY_DOMAIN
      - FORGEJO__server__SSH_DOMAIN=git.$MY_DOMAIN
      - FORGEJO__server__SSH_PORT=22 # ⚠️ update when you change the SSH port below
      - FORGEJO__migrations__ALLOWED_DOMAINS=github.com, *.github.com # required to allow repository migrations from GitHub
    restart: always
    networks:
      - internal
      - proxy
    depends_on:
      - postgres
    volumes:
      - ./data/server:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "22:22" # ⚠️ change to e.g. 2222:22 if you dont want to move the SSH daemon port
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.Forgejo.entrypoints=https"
      - "traefik.http.routers.Forgejo.rule=Host(`git.$MY_DOMAIN`)"
      - "traefik.http.routers.Forgejo.priority=1000"
      - "traefik.http.routers.Forgejo.tls=true"
      - "traefik.http.routers.Forgejo.service=forgejo"
      - "traefik.http.routers.Forgejo.middlewares=default-headers@file"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
      
      - "traefik.docker.network=proxy"

networks:
  internal:
  proxy:
    external: true